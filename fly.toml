app = "world-heritage-practice"
primary_region = "nrt"

[build]
dockerfile = "frontend/Dockerfile"
build-target = "production"

[env]
APP_ENV = "production"
NODE_ENV = "production"
HOST = "0.0.0.0"
PORT = "3000"
FRONTEND_URL = "https://world-heritage.misato-lab.com"
BETTER_AUTH_URL = "https://world-heritage.misato-lab.com"
CORS_ORIGINS = "https://world-heritage.misato-lab.com"
NETLIFY_SITE_ID = "5ce0a431-2976-4636-a6ed-39052dfd21b4"
STRIPE_LIVEMODE = "true"
# Enabled only after the production settings and representative checks pass.
PAID_MEMBERSHIP_ENABLED = "false"
PASSWORD_RESET_ENABLED = "false"
ERROR_NOTIFICATIONS_ENABLED = "false"

# Run migrations once per deploy. Running them on every cold start delayed
# listening past the Fly proxy's connect timeout after auto-stop, so the first
# sign-in/sign-up request after idle failed.
[deploy]
release_command = "sh -c 'DATABASE_URL=\"${DATABASE_URL_UNPOOLED:-$DATABASE_URL}\" npm run db:migrate'"

[processes]
app = "node .output/server/index.mjs"

[http_service]
processes = ["app"]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "60s"
interval = "30s"
method = "GET"
path = "/api/v1/health"
timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
