name: Daily production smoke test

on:
  schedule:
    # 09:17 JST daily (UTC). Avoid the busy start of the hour.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check smoke test failure detection
        run: node --test scripts/production-smoke.test.mjs
      - name: Check public pages and API without signing in
        run: node scripts/production-smoke.mjs
